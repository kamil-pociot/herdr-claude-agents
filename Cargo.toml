[package]
name = "herdr-claude-agents"
version = "0.1.0"
edition = "2024"
description = "Herdr plugin: Claude Code background sessions as Herdr agents"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
libc = "0.2"
notify = "8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[profile.release]
strip = true
