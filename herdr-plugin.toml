id = "kamilpociot.claude-agents"
name = "Claude background agents"
version = "0.2.3"
min_herdr_version = "0.9.2"
description = "Shows Claude Code background sessions as Herdr agents, each in the space of its project"
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

# The watcher: runs for as long as the server does (it exits when the server
# stops or the plugin is disabled) and keeps one tab per session.
[[startup]]
command = ["sh", "-c", "exec sh \"$HERDR_PLUGIN_ROOT/bin/herdr-claude-agents\" startup"]

# Reopens session tabs you closed, and starts the watcher if none runs (for
# example right after `herdr plugin link`).
[[actions]]
id = "open"
title = "Claude: show background sessions"
contexts = ["workspace"]
command = ["sh", "-c", "exec sh \"$HERDR_PLUGIN_ROOT/bin/herdr-claude-agents\" open"]

# Starts a background session in a folder of the current space: opens the
# dialog below over it.
[[actions]]
id = "new"
title = "Claude: new background session"
contexts = ["workspace"]
command = ["sh", "-c", "exec sh \"$HERDR_PLUGIN_ROOT/bin/herdr-claude-agents\" new"]

# One background session: `claude attach <id>`, opened by the watcher in the
# session's folder (hence $HERDR_PLUGIN_ROOT rather than a relative path).
[[panes]]
id = "session"
title = "Claude session"
placement = "tab"
command = ["sh", "-c", "exec sh \"$HERDR_PLUGIN_ROOT/bin/herdr-claude-agents\" attach"]

# The new-session dialog: folder (relative to the space), command, prompt.
[[panes]]
id = "new-session"
title = "New Claude background session"
placement = "popup"
width = "72%"
height = 18
command = ["sh", "-c", "exec sh \"$HERDR_PLUGIN_ROOT/bin/herdr-claude-agents\" dialog"]
